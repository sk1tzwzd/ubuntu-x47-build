# X47 amnesia mode — transparent Tor for the "anon" user.
# Installed to /etc/tor/torrc.d/torrc-anon.conf (included by the main torrc).

# Virtual address range used for AutomapHostsOnResolve (.onion, etc.)
VirtualAddrNetworkIPv4 10.192.0.0/10
AutomapHostsOnResolve 1

# Transparent proxy + DNS ports the nftables ruleset redirects anon traffic to.
TransPort 127.0.0.1:9040
DNSPort 127.0.0.1:9053

# SOCKS stays available for torsocks / apps that want it explicitly.
SOCKSPort 127.0.0.1:9050
