# X47 amnesia mode — transparent Tor for the "anon" user.
# 60-amnesia.sh appends these directives (comments stripped) directly into
# /etc/tor/torrc between markers, because the system_tor AppArmor profile
# denies reading /etc/tor/torrc.d/ drop-ins on stock Ubuntu.

VirtualAddrNetworkIPv4 10.192.0.0/10
AutomapHostsOnResolve 1
AutomapHostsSuffixes .onion,.exit
TransPort 127.0.0.1:9040
DNSPort 127.0.0.1:9053 NoIPv6Traffic IPv4Traffic
SOCKSPort 127.0.0.1:9050

# Direct Tor by default. Built-in public obfs4 bridges are often unreachable
# (dead, or blocked behind a VPN like Mullvad) and leave SOCKS stuck forever.
# To force bridges, uncomment UseBridges + ClientTransportPlugin + Bridge lines
# and add working bridges from https://bridges.torproject.org/
#UseBridges 1
#ClientTransportPlugin obfs4 exec /usr/bin/obfs4proxy
#Bridge obfs4 IP:PORT FINGERPRINT cert=... iat-mode=0
