      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- App tile -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="#99f6e4" stroke-opacity="0.18" stroke-width="2"/>

