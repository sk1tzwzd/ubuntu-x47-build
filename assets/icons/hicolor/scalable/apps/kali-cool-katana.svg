<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fb"/>
      <stop offset="0.55" stop-color="#cdd8e0"/>
      <stop offset="1" stop-color="#93a3af"/>
    </linearGradient>
  </defs>
  <!-- slash streak -->
  <path d="M70 452 L452 70" stroke="#7c3aed" stroke-width="20" stroke-linecap="round" opacity="0.35"/>
  <g transform="rotate(-45 256 256)">
    <!-- blade -->
    <path d="M256 58 c26 0 40 20 40 46 v210 h-80 v-210 c0-26 14-46 40-46 z" fill="url(#blade)"/>
    <!-- edge highlight -->
    <rect x="240" y="104" width="8" height="204" rx="4" fill="#ffffff" opacity="0.8"/>
    <!-- guard (tsuba) -->
    <rect x="196" y="312" width="120" height="26" rx="13" fill="#d4af37"/>
    <!-- handle -->
    <rect x="228" y="338" width="56" height="132" rx="16" fill="#1f2430"/>
    <!-- handle wrap -->
    <g fill="#e23b3b">
      <rect x="228" y="356" width="56" height="12" rx="4" transform="skewY(-14)"/>
      <rect x="228" y="392" width="56" height="12" rx="4" transform="skewY(-14)"/>
      <rect x="228" y="428" width="56" height="12" rx="4" transform="skewY(-14)"/>
    </g>
  </g>
</svg>
